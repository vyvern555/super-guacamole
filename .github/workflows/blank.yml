name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Unzip
        run: unzip -oq AIPhotoEnhancer_step6.zip
      - name: Fix camera unbind
        run: |
          python3 - <<'PY'
          p = 'AIPhotoEnhancer_fixsrc/app/src/main/java/com/aienhancer/app/CameraScreen.kt'
          s = open(p, encoding='utf-8').read()
          old = "    DisposableEffect(provider, preview, imageCapture) {\n        onDispose {\n            runCatching { provider?.unbind(preview, imageCapture) }\n        }\n    }\n"
          new = "    val boundProvider = provider\n    DisposableEffect(boundProvider, preview, imageCapture) {\n        onDispose {\n            runCatching { boundProvider?.unbind(preview, imageCapture) }\n        }\n    }\n"
          if old in s:
              open(p, 'w', encoding='utf-8').write(s.replace(old, new))
              print('camera fix applied')
          else:
              print('camera fix not needed')
          PY
      - name: Build
        working-directory: AIPhotoEnhancer_fixsrc
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: AIPhotoEnhancer_fixsrc
        run: |
          grep '^e: ' build.log | head -15 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AIPhotoEnhancer_fixsrc/app/build/outputs/apk/debug/app-debug.apk
